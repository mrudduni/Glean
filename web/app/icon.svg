<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1c13"/>
      <stop offset="100%" stop-color="#1b4d32"/>
    </linearGradient>
    <linearGradient id="sproutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#85f2b8"/>
      <stop offset="100%" stop-color="#38b874"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Rounded Base Tile -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#52e396" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Radar / Rotation Concentric Field Ring -->
  <circle cx="32" cy="32" r="22" stroke="#52e396" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="2 3"/>
  <circle cx="32" cy="32" r="14" stroke="#52e396" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Seedling / Sprout Brand Glyph -->
  <g filter="url(#glow)">
    <!-- Stem -->
    <path d="M32 46 C32 37 32 30 32 24" stroke="url(#sproutGrad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Left Leaf -->
    <path d="M32 32 C26 32 20 27 20 21 C26 21 31 25 32 32 Z" fill="url(#sproutGrad)"/>
    <!-- Right Leaf -->
    <path d="M32 26 C38 26 44 21 44 15 C38 15 33 19 32 26 Z" fill="url(#sproutGrad)"/>
    <!-- Central Seed Core -->
    <circle cx="32" cy="46" r="2.5" fill="#f5b875"/>
  </g>
</svg>
